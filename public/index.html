<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>QuickList — Shopping List</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <h1>QuickList</h1>

      <form id="item-form" class="item-form" aria-label="Add item">
        <input id="item-input" type="text" placeholder="Add an item (press Enter)" aria-label="Item name" autocomplete="off" />
        <button type="submit">Add</button>
      </form>

      <div class="controls">
        <div class="filters">
          <button data-filter="all" class="active">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="done">Done</button>
        </div>
        <div class="actions">
          <button id="clear-done">Clear Done</button>
          <button id="clear-all">Clear All</button>
        </div>
      </div>

      <ul id="items" class="items" aria-live="polite"></ul>

      <footer class="status">
        <span id="count">0 items</span>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
