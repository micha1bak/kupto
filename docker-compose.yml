services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "[::]:3000:3000"
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://#{DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
    depends_on:
      - db
    restart: always
  db:
    image: postgres:18.1
    ports:
      - "5432:5432"
      - "[::]:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod:/var/lib/postgresql
    restart: always

volumes:
  db_prod: