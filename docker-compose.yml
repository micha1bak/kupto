version: '3.8'

services:
  db:
    image: postgres:18.1
    container_name: kupto_dev_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

volumes:
  postgres_dev_data: