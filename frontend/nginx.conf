server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS Dockera z krótkim TTL: po odtworzeniu kontenera backendu (nowe IP) nginx nie
    # kieruje ruchu pod stary adres. Zmienna w proxy_pass wymusza ponowne rozwiązywanie nazwy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strumieniowanie odpowiedzi czatu (SSE) — bez buforowania i z długim limitem czasu.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
