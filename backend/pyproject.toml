[project]
name = "kupto"
version = "2.0.0"
description = "Kupto — czatowa aplikacja do wspólnych list zakupów oparta na LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "openai",
    "pywebpush>=2.5.0",
    "tzdata",  # strefa Europe/Warsaw niezależnie od obrazu systemu (#40)
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kupto"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["llm: ewaluacje z prawdziwym modelem OpenAI (wymagają OPENAI_API_KEY)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
