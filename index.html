<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>QuickList — Shopping List</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app-container">
    <header class="header">
        <h1>QuickList</h1>
    </header>

    <div class="toolbar">
        <select id="category-filter" class="select-input">
            <option value="all">Wszystkie kategorie</option>
            <option value="1">Warzywa</option>
            <option value="2">Owoce</option>
        </select>
    </div>

    <main class="main-content">
        <ul id="shopping-ul" class="shopping-list">
            <li class="shopping-item">
                <div class="item-info">
                    <span class="item-name">Jabłko</span>
                    <span class="item-category badge-blue">Owoce</span>
                </div>
                <button class="delete-btn" title="Usuń">🗑️</button>
            </li>
        </ul>
    </main>

    <div class="add-section">
        <div class="input-wrapper">
            <input id="input" class="text-input" placeholder="Co kupujemy?" autocomplete="off">
            <ul id="suggestions" class="suggestions-list"></ul>
        </div>
        <button id="btn-open-modal" class="btn-text">Brak produktu? Dodaj do bazy</button>
    </div>
</div>

<div id="new-product-modal" class="modal hidden">
    <div class="modal-content">
        <h2>Nowy produkt</h2>
        <input id="new-product-name" class="text-input" placeholder="Nazwa produktu">
        <select id="new-product-category" class="select-input">
            <option value="" disabled selected>Wybierz kategorię</option>
        </select>
        <div class="modal-actions">
            <button id="btn-cancel" class="btn-secondary">Anuluj</button>
            <button id="btn-save-product" class="btn-primary">Zapisz</button>
        </div>
    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
