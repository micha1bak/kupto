# Produkcja na serwerze EC2 (ADR 0001): obrazy z GHCR zamiast budowania na miejscu, sekrety
# w /opt/kupto/.env generowanym z SSM przez kupto-update.sh. Lokalny rozwój: docker-compose.yml
# w katalogu głównym.
name: kupto

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    restart: always

  backend:
    image: ghcr.io/micha1bak/kupto-backend:main
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL}
      CHAT_RATE_LIMIT_PER_HOUR: ${CHAT_RATE_LIMIT_PER_HOUR:-30}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
    restart: always

  web:
    image: ghcr.io/micha1bak/kupto-frontend:main
    # Do czasu HTTPS (#19) web nasłuchuje bezpośrednio na 80; potem przed nim stanie Caddy.
    ports:
      - "80:80"
    depends_on:
      - backend
    logging: *logging
    restart: always

volumes:
  db_data:
