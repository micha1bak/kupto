# Produkcja na serwerze EC2 (ADR 0001): obrazy z GHCR zamiast budowania na miejscu, sekrety
# w /opt/kupto/.env generowanym z SSM przez kupto-update.sh. Lokalny rozwój: docker-compose.yml
# w katalogu głównym.
name: kupto

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [app]
    restart: always

  backend:
    image: ghcr.io/micha1bak/kupto-backend:main
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL}
      CHAT_RATE_LIMIT_PER_HOUR: ${CHAT_RATE_LIMIT_PER_HOUR:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Web Push (#27) — opcjonalne; puste = powiadomienia wyłączone.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Linki w mailach (#77) prowadzą do https://KUPTO_DOMAIN/…
      KUPTO_DOMAIN: ${KUPTO_DOMAIN}
      # Wysyłka maili (#77): bez parametrów SSM `log` — nic nie jest wysyłane ani wymagane.
      # `ses` używa poświadczeń roli instancji (infra/ses.tf, infra/README.md).
      MAIL_BACKEND: ${MAIL_BACKEND:-log}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SES_REGION: ${MAIL_SES_REGION:-eu-north-1}
    depends_on:
      db:
        condition: service_healthy
    # Logi JSON w journald (#23): przeżywają odtworzenie kontenera przy wdrożeniu, więc
    # kupto-usage.sh liczy z nich dzienne zużycie tokenów. `docker compose logs` działa dalej.
    logging:
      driver: journald
      options:
        tag: kupto-backend
    networks:
      app:
        # Stały adres: tylko on ma dostęp do IMDS (poświadczenia roli dla SES, #77) — reguła
        # DOCKER-USER w kupto-update.sh blokuje 169.254.169.254 pozostałym kontenerom.
        ipv4_address: 172.30.0.10
    restart: always

  web:
    image: ghcr.io/micha1bak/kupto-frontend:main
    depends_on:
      - backend
    logging: *logging
    networks: [app]
    restart: always

  # HTTPS z automatycznym certyfikatem Let's Encrypt dla KUPTO_DOMAIN (#19); jedyny kontener
  # z portami wystawionymi na zewnątrz.
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      KUPTO_DOMAIN: ${KUPTO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certyfikaty muszą przetrwać odtworzenie kontenera — inaczej limity Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging
    networks: [app]
    restart: always

networks:
  # Sieć ze stałą podsiecią (zamiast domyślnej), żeby backend miał stały adres dla reguły IMDS.
  # Poza 172.31.0.0/16 (domyślne VPC) i typowymi podsieciami Dockera (172.17–172.29).
  app:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db_data:
  caddy_data:
  caddy_config:
